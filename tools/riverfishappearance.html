<!doctype html><html lang="sv"><meta charset="utf-8"><title>Åfiskarnas neutrala form</title><style>body{margin:0;background:#edf0f3;font:17px system-ui}h1,p{margin:12px 24px}#labels{position:absolute;top:445px;left:0;display:grid;grid-template-columns:repeat(3,600px);row-gap:370px;text-align:center;pointer-events:none;width:1800px}</style><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script><h1>Åfisk · hela neutrala formen</h1><p>Samma generiska kropp med publikens sex befintliga storleksförhållanden och färger. Enhetsgeometri visas med längden lika stor för jämförelsen.</p><div id="labels"></div><script type="module">
import * as T from 'three';import{fishGeometry}from'../src/riverfish.js';import{RIVER_FISH as C}from'../src/config.js';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1800,740);renderer.setPixelRatio(1);renderer.setScissorTest(true);renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);const geometry=fishGeometry(),items=[];
for(const spec of C.species){const scene=new T.Scene();scene.background=new T.Color(0xc5dce6);scene.add(new T.HemisphereLight(0xf2f8ff,0x65574d,2));const light=new T.DirectionalLight(0xfff5df,2.2);light.position.set(3,5,4);scene.add(light);const group=new T.Group(),fish=new T.Mesh(geometry,new T.MeshLambertMaterial({color:spec.color,vertexColors:true,side:T.DoubleSide}));fish.scale.set(spec.w/spec.len,spec.h/spec.len,1);group.add(fish);scene.add(group);const camera=new T.PerspectiveCamera(35,600/370,.01,10);camera.position.set(0,.16,1.85);camera.lookAt(0,0,0);items.push({scene,group,camera});const label=document.createElement('span');label.textContent=`${spec.name} · ${Math.round(spec.len*100)} × ${Math.round(spec.h*100)} cm`;document.getElementById('labels').append(label);}
function show(mode){items.forEach(({scene,group,camera},i)=>{group.rotation.set(0,mode==='front'?0:mode==='quarter'?Math.PI/3:Math.PI/2,0);renderer.setViewport((i%3)*600,i<3?370:0,600,370);renderer.setScissor((i%3)*600,i<3?370:0,600,370);renderer.render(scene,camera);});}show('side');window.fishAppearance={show,ready:true};
</script></html>
