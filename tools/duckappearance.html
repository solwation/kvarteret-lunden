import * as T from 'three';import{duckModel}from'../src/duckmodel.js';const scene=new T.Scene();scene.background=new T.Color(0xd3e3ed);scene.add(new T.HemisphereLight(0xe2f1ff,0x635d41,2));const sun=new T.DirectionalLight(0xfff3dd,2.5);sun.position.set(4,8,5);scene.add(sun);const camera=new T.PerspectiveCamera(35,1500/800,.01,1000),renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1500,800);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);const group=new T.Group();for(const female of [false,true]){const m=new T.Mesh(duckModel(female),new T.MeshStandardMaterial({vertexColors:true,roughness:1}));m.position.x=female?.65:-.65;group.add(m)}scene.add(group);const ground=new T.Mesh(new T.PlaneGeometry(50,50),new T.MeshStandardMaterial({color:0x87916c}));ground.rotation.x=-Math.PI/2;ground.position.y=-.003;scene.add(ground);function show(mode){group.children.forEach(m=>m.rotation.y=mode==='side'?Math.PI/2:mode==='quarter'?.65:0);camera.position.set(0,1.15,3.5);camera.lookAt(0,.35,0);scene.updateMatrixWorld(true);renderer.render(scene,camera)}show('front');window.duckAppearance={show,ready:true};</script></html>
